<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <title>Login de Usuário</title>
    
</head>
<body>
    <header>
        <img src="images/logo.chat.png">
    </header>
    <main>
        <div id="login" class="container">
            <form onsubmit="return false">
                <h1>Bem-vindo</h1>
                <h2>Entre para começar a conversar</h2>
                <div class="input-box">
                    <label for="email">Usuário</label>
                    <input placeholder="Usuário" type="text" id="user">
                </div>
                <div class="input-box">
                    <label for="senha">senha</label>
                    <input placeholder="Senha" type="password" id="senha">
                </div>
                <div class="button"> 
                    <button onclick="login()" type="button" class="login">Entrar</button>
            </form>
        </div>
    </main>

    <footer>
        <img src="images/logo.if.png">
        <p>IFRN campus Santa Cruz | Trabalho de Programação para a Internet</p>
        <p>Prof. Marcelo Figueiredo Barbosa Júnior</p> 
    </footer>
</body>
</html>
